<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <title>Ipon Budget</title>
  <style>
    :root{--bg:#f3f6f5;--card:#fff;--tx:#14201d;--mu:#6b7a76;--pr:#0f766e;--pr2:#115e59;--bd:#e2e9e7;--bad:#dc2626;--ok:#16a34a;--warn:#f59e0b;--shadow:0 12px 30px #0f766e12}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1412;--card:#16201d;--tx:#e8f0ed;--mu:#8fa39d;--bd:#243430;--shadow:0 12px 30px #0005}}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(82px + env(safe-area-inset-bottom))}
    #app{max-width:620px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;font-size:17px;margin-bottom:10px}.top button{font-size:26px;padding:0 12px}
    button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}.chips,.actions{display:flex;gap:7px}.chips{margin-bottom:13px}.chips button,.pill{flex:1;padding:9px 5px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:13px}.chips .on,.pill.on{background:var(--pr);color:#fff;border-color:var(--pr)}
    .card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:15px;margin-bottom:13px;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0}.hero small{opacity:.82}.big{font-size:34px;font-weight:800;margin:3px 0 11px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:7px}.hero .bar{background:#ffffff40}.bar i{display:block;height:100%;border-radius:9px;background:var(--pr)}.hero .bar i{background:#fff}
    .cat{padding:10px 0;border-bottom:1px solid var(--bd)}.cat:last-child{border:0}.mu{color:var(--mu);font-size:13px}.neg{color:var(--bad)}.pos{color:var(--ok)}.tip{background:#fef3c7;color:#78350f;border-radius:13px;padding:11px 12px;margin-bottom:13px;font-size:13px}.tip.good{background:#dcfce7;color:#14532d}
    nav{position:fixed;z-index:4;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;padding:10px 0;font-size:12px;color:var(--mu)}nav .on{color:var(--pr);font-weight:700}nav span{display:block;font-size:20px}.fab{position:fixed;z-index:5;right:20px;bottom:calc(79px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--pr);color:#fff;font-size:32px;box-shadow:0 6px 18px #0004}
    #sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}#sheet.o{display:flex}#sheet>div{background:var(--card);width:100%;max-width:620px;margin:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
    input,select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:5px 0}.amt{font-size:30px;font-weight:700;text-align:center}.pick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.pick button{padding:8px 11px;border-radius:99px;border:1px solid var(--bd);font-size:13px}.pick .on{background:var(--pr);color:#fff;border-color:var(--pr)}.go{width:100%;background:var(--pr);color:#fff;padding:13px;border-radius:14px;font-weight:700;margin-top:7px}.sec{background:var(--bg);border:1px solid var(--bd);padding:11px;border-radius:12px;width:100%;margin-top:8px}.num{width:112px;text-align:right;margin:0;padding:8px}h3{margin:4px 0 9px;font-size:16px}.empty{text-align:center;padding:26px 8px;color:var(--mu)}.search{margin-bottom:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--bg);border-radius:13px;padding:10px}.stat b{display:block;font-size:17px}.spark{display:flex;align-items:end;height:90px;gap:5px;padding-top:10px}.spark i{flex:1;background:var(--pr);border-radius:5px 5px 2px 2px;min-height:4px;opacity:.85}.spark small{display:block;text-align:center;font-size:10px;color:var(--mu);margin-top:3px}
  </style>
</head>
<body>
<main id="app"></main><button class="fab" onclick="openAdd()" aria-label="Add transaction">+</button>
<nav><button data-v="home" onclick="go('home')"><span>📊</span>Overview</button><button data-v="hist" onclick="go('hist')"><span>🧾</span>History</button><button data-v="plan" onclick="go('plan')"><span>⚙️</span>Plan</button></nav>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sh"></div></div>
<script>
const $=s=>document.querySelector(s),KEY='iponbudget.v2';
const DEF={income:8000,tx:[],cats:[{id:'bills',n:'Internet & House',e:'🏠',b:2500},{id:'groc',n:'House Grocery',e:'🛒',b:1000},{id:'sav',n:'Savings',e:'🏦',b:2500,s:1},{id:'emg',n:'Emergency Fund',e:'🛟',b:2000,s:1},{id:'ride',n:'Transport',e:'🛵',b:2015},{id:'food',n:'Food',e:'🍜',b:3000},{id:'fun',n:'Dates & Fun',e:'💕',b:1985},{id:'misc',n:'Buffer / Misc',e:'🧾',b:1000}]};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),peso=n=>'₱'+Math.round(n).toLocaleString('en-PH'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(DEF)}catch{return structuredClone(DEF)}}let S=Object.assign({goal:{n:'Emergency fund',t:30000},rec:[]},load()),view='home',per='m',ym=ymd(new Date()).slice(0,7),sel='food',query='';
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),cat=id=>S.cats.find(c=>c.id===id)||{n:'Other',e:'•',b:0}, inPer=t=>t.d.slice(0,7)===ym&&(per==='m'||(per==='1'?+t.d.slice(8)<=15:+t.d.slice(8)>15)), P=()=>S.tx.filter(inPer).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
function go(v){view=v;render();scrollTo(0,0)}function mv(n){const[y,m]=ym.split('-').map(Number);ym=ymd(new Date(y,m-1+n,1)).slice(0,7);render()}function hdr(){let d=new Date(ym+'-01T00:00');return `<div class=top><button onclick="mv(-1)">‹</button><b>${d.toLocaleString('en',{month:'long',year:'numeric'})}</b><button onclick="mv(1)">›</button></div><div class=chips>${[['m','Whole month'],['1','1st cut-off'],['2','2nd cut-off']].map(([k,l])=>`<button class="${per===k?'on':''}" onclick="per='${k}';render()">${l}</button>`).join('')}</div>`}
function home(){const tx=P(),k=per==='m'?1:.5,bud=S.cats.reduce((a,c)=>a+c.b*k,0),sp=tx.reduce((a,t)=>a+t.a,0),inc=S.income*2*k,left=bud-sp,saved=S.tx.filter(t=>cat(t.c).s).reduce((a,t)=>a+t.a,0),ess=S.cats.filter(c=>!c.s).reduce((a,c)=>a+c.b,0);
const rows=S.cats.map(c=>{let s=tx.filter(t=>t.c===c.id).reduce((a,t)=>a+t.a,0),b=c.b*k,p=b?s/b*100:0,col=c.s?'var(--ok)':p>100?'var(--bad)':p>80?'var(--warn)':'var(--pr)';return `<div class=cat><div class=row><span>${c.e} ${esc(c.n)}</span><span><b>${peso(s)}</b> <span class=mu>/ ${peso(b)}</span></span></div><div class=bar><i style="width:${Math.min(100,p)}%;background:${col}"></i></div><div class=mu>${c.s?(p>=100?'✅ Target reached':peso(b-s)+' to go'):(b-s>=0?peso(b-s)+' left':`<span class=neg>Over by ${peso(s-b)}</span>`)}</div></div>`}).join('');
const warn=bud>inc?`<div class=tip>⚠️ Your budget (${peso(bud)}) is higher than your income (${peso(inc)}). Trim a category in Plan.</div>`:'';return hdr()+insight(tx,bud,sp)+`<div class="card hero"><small>${left>=0?'Left to spend / save':'Over budget'}</small><div class=big>${peso(Math.abs(left))}</div><div class=row><small>Spent ${peso(sp)}</small><small>Budget ${peso(bud)}</small></div><div class=bar><i style="width:${Math.min(100,bud?sp/bud*100:0)}%"></i></div></div>${warn}<div class=card><h3>Categories</h3>${rows}</div><div class=card><h3>🏦 Total saved</h3><div class=big style="font-size:26px;color:var(--ok)">${peso(saved)}</div><div class=mu>That covers about <b>${ess?(saved/ess).toFixed(1):0} month(s)</b> of regular expenses.</div><div class=row style="margin-top:12px"><span>🎯 ${esc(S.goal.n)}</span><b>${peso(saved)} / ${peso(S.goal.t)}</b></div><div class=bar><i style="width:${Math.min(100,S.goal.t?saved/S.goal.t*100:0)}%;background:var(--ok)"></i></div></div>`}
function insight(tx,bud,sp){if(!tx.length)return '';let top=tx.reduce((a,t)=>a+t.a,0),largest=S.cats.map(c=>({c,s:tx.filter(t=>t.c===c.id).reduce((a,t)=>a+t.a,0)})).sort((a,b)=>b.s-a.s)[0];return `<div class="tip ${sp<=bud?'good':''}">💡 ${sp<=bud?`Nice pace — you have ${peso(bud-sp)} left this period.`:`You’re ${peso(sp-bud)} over this period’s plan.`} ${largest?.s?`Largest category: <b>${esc(largest.c.n)}</b>.`:''}</div>`}
function hist(){let tx=P().filter(t=>!query||[t.n,cat(t.c).n].join(' ').toLowerCase().includes(query.toLowerCase()));return hdr()+`<input class=search placeholder="🔎 Search entries" value="${esc(query)}" oninput="query=this.value;render()"><div class=card>${tx.length?tx.map(t=>{let c=cat(t.c);return `<div class=cat><div class=row><span>${c.e} ${esc(t.n||c.n)}<div class=mu>${esc(c.n)} · ${t.d}${t.rec?' · 🔁 recurring':''}</div></span><span><b>${peso(t.a)}</b> <button onclick="del(${t.id})" aria-label="Delete">✕</button></span></div></div>`}).join(''):'<div class=empty>No entries match this period.<br>Tap + to add one.</div>'}</div>`}
function plan(){let tot=S.cats.reduce((a,c)=>a+c.b,0),inc=S.income*2;return `<h3>Plan</h3><div class=card><div class=row><span>Income per cut-off</span><input class=num type=number value="${S.income}" onchange="S.income=+this.value||0;save();render()"></div><div class=mu>Monthly income ${peso(inc)} · Allocated ${peso(tot)} · <b class="${inc-tot<0?'neg':'pos'}">${inc-tot<0?'Over by '+peso(tot-inc):'Unassigned '+peso(inc-tot)}</b></div></div><div class=card><h3>Monthly budget per category</h3>${S.cats.map(c=>`<div class=row style="padding:5px 0"><span>${c.e} ${esc(c.n)}${c.s?' <span class=mu>(saving)</span>':''}</span><input class=num type=number value="${c.b}" onchange="setB('${c.id}',this.value)"><button onclick="delCat('${c.id}')">✕</button></div>`).join('')}</div><div class=card><h3>🔁 Recurring expenses</h3><div class=mu>Automatically add a planned entry when you open a new month.</div>${S.rec.map((r,i)=>`<div class=cat><div class=row><span>${esc(r.name)}<div class=mu>${peso(r.amount)} · ${esc(cat(r.cat).n)}</div></span><button onclick="removeRec(${i})">✕</button></div></div>`).join('')||'<div class=empty>No recurring expenses yet.</div>'}<button class=sec onclick="openRecurring()">＋ Add recurring expense</button></div>${goalCard()}${catCard()}<div class=card><h3>Your data</h3><div class=mu>Stored only on this device. Export a backup before changing phones.</div><button class=sec onclick="exp()">⬇️ Export backup</button><label class=sec style="display:block;text-align:center">⬆️ Import backup<input type=file accept=.json hidden onchange="imp(this.files[0])"></label><button class=sec style="color:var(--bad)" onclick="if(confirm('Delete ALL entries?')){S.tx=[];save();render()}">🗑 Clear all entries</button></div>`}
function goalCard(){return `<div class=card><h3>🎯 Savings goal</h3><input value="${esc(S.goal.n)}" onchange="S.goal.n=this.value;save()" placeholder="Goal name"><div class=row><span>Target</span><input class=num type=number value="${S.goal.t}" onchange="S.goal.t=+this.value||0;save();render()"></div></div>`}function catCard(){return `<div class=card><h3>➕ New category</h3><div class=row><input id=ne style="width:64px;text-align:center" value="📌"><input id=nn placeholder="Name"></div><div class=row><input id=nb type=number placeholder="Monthly ₱"><label class=row style="gap:6px;white-space:nowrap"><input type=checkbox id=ns style="width:auto;margin:0"> Savings</label></div><button class=go onclick="addCat()">Add category</button></div>`}
function render(){$('#app').innerHTML=view==='home'?home():view==='hist'?hist():plan();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));}
function openAdd(){sel='food';$('#sheet').classList.add('o');drawAdd()}function closeSheet(){$('#sheet').classList.remove('o')}function drawAdd(){let today=ymd(new Date());$('#sh').innerHTML=`<input class=amt id=a type=number inputmode=decimal placeholder="₱0" autofocus><div class=pick>${S.cats.map(c=>`<button class="${sel===c.id?'on':''}" onclick="sel='${c.id}';drawAdd()">${c.e} ${esc(c.n)}</button>`).join('')}</div><input id=n placeholder="Note (optional)"><input id=d type=date value="${today}"><label class=mu><input id=r type=checkbox style="width:auto"> Add as recurring monthly</label><button class=go onclick="add()">Save entry</button>`;setTimeout(()=>$('#a')?.focus(),50)}
function add(){let v=+$('#a').value;if(!(v>0))return $('#a').focus();let data={id:Date.now(),d:$('#d').value||ymd(new Date()),c:sel,a:v,n:$('#n').value.trim()};S.tx.push(data);if($('#r').checked)S.rec.push({name:data.n||cat(sel).n,amount:v,cat:sel});save();closeSheet();ym=data.d.slice(0,7);render()}function del(id){if(confirm('Delete this entry?')){S.tx=S.tx.filter(t=>t.id!==id);save();render()}}function setB(id,v){cat(id).b=Math.max(0,+v||0);save();render()}function delCat(id){if(S.cats.length>1&&confirm('Remove this category? Past entries stay in History.')){S.cats=S.cats.filter(c=>c.id!==id);save();render()}}function addCat(){let n=$('#nn').value.trim();if(!n)return $('#nn').focus();S.cats.push({id:'c'+Date.now(),n,e:$('#ne').value||'📌',b:+$('#nb').value||0,...($('#ns').checked?{s:1}:{})});save();render()}
function openRecurring(){$('#sheet').classList.add('o');$('#sh').innerHTML=`<h3>Add recurring expense</h3><input id=rn placeholder="Name"><input id=ra type=number placeholder="Amount"><select id=rc>${S.cats.map(c=>`<option value="${c.id}">${c.e} ${esc(c.n)}</option>`).join('')}</select><button class=go onclick="saveRecurring()">Add recurring expense</button>`}function saveRecurring(){if(!$('#rn').value.trim()||!($('#ra').value>0))return;S.rec.push({name:$('#rn').value.trim(),amount:+$('#ra').value,cat:$('#rc').value});save();closeSheet();render()}function removeRec(i){S.rec.splice(i,1);save();render()}
function applyRecurring(){let month=ymd(new Date()).slice(0,7),seen=new Set(S.tx.filter(t=>t.d.slice(0,7)===month&&t.rec).map(t=>t.n));S.rec.forEach((r,i)=>{if(!seen.has(r.name))S.tx.push({id:Date.now()+i,d:month+'-01',c:r.cat,a:r.amount,n:r.name,rec:1})});save()}function exp(){let u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='ipon-budget-backup.json';a.click();URL.revokeObjectURL(u)}function imp(f){if(!f)return;f.text().then(t=>{try{let o=JSON.parse(t);if(o.cats&&o.tx){S=Object.assign(S,o);save();render()}else alert('Invalid backup')}catch{alert('Invalid backup')}})}
applyRecurring();render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
